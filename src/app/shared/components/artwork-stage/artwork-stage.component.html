<!-- Le tableau : calque de repos + photos du défilé empilées + lumière +
     message. Rien d'autre. Conteneur engagé = opacité (durée pilotée par
     l'état) ; photos empilées = défilé en fondu (celle portant .current est
     visible) ; SceneFx = calque de lumière chorégraphié par GSAP ; message =
     naissance chorégraphiée par GSAP (classe .visible = marqueur + voile). -->
<div class="stage" [class.message-on]="messageVisible()">
  <img class="stage__img" [src]="idleSrc()" [alt]="artwork().name" />

  <div
    class="stage__engaged"
    [class.alive]="isAlive()"
    [style.opacity]="engagedOpacity()"
    [style.transition-duration.ms]="fadeMs()"
  >
    @for (src of engagedSrcs(); track $index) {
      <img
        class="stage__img stage__img--engaged"
        [class.current]="$index === photoIndex()"
        [src]="src"
        alt=""
      />
    }
  </div>

  <lf-scene-fx
    class="stage__fx"
    [state]="state()"
    [distance]="distance()"
    [intensity]="intensity()"
    [scene]="scene()"
  />

  <p class="stage__message" [class.visible]="messageVisible()">
    <span class="stage__message-text" #messageTextEl>{{ messageText() }}</span>
    @if (eventLine() !== '') {
      <span class="stage__event" #eventLineEl>{{ eventLine() }}</span>
    }
  </p>
</div>
